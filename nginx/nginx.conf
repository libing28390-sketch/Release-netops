upstream netops_backend {
    server netops:8003;
    keepalive 32;
}

upstream grafana_backend {
    server grafana-auth:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow local health check without redirection
    location = /api/health {
        proxy_pass http://netops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/netops.crt;
    ssl_certificate_key /etc/nginx/ssl/netops.key;

    # SSL protocols and ciphers optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (optional, recommended for standard HTTPS)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Keep the standard MIME map inherited from the official nginx image.
    # A server-level `types {}` block replaces the inherited map rather than
    # extending it; that would make index.html application/octet-stream and
    # cause browsers to download the SPA entrypoint instead of rendering it.

    # ── 安全头 ──
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── 请求体限制 ──
    client_max_body_size 150m;

    # ── 静态资源 (Vite 构建产物，含 hash，永久缓存) ──
    # Match only real Vite asset files. Do not use ``^~ /assets/`` here:
    # /assets/nsot, /assets/diagnose, etc. are React routes and must reach
    # the SPA fallback instead of being treated as files in this directory.
    # Keep RackVision runtime MIME types in dedicated locations so they do not
    # override the standard HTML/CSS/JS mappings inherited above.
    location ~* \.glb$ {
        root /usr/share/nginx/html;
        default_type model/gltf-binary;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.gltf$ {
        root /usr/share/nginx/html;
        default_type model/gltf+json;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.ktx2$ {
        root /usr/share/nginx/html;
        default_type image/ktx2;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.basis$ {
        root /usr/share/nginx/html;
        default_type application/octet-stream;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/assets/.+\.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot|css|js|map|glb|gltf|bin|ktx2|basis)$ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── 其他前端静态文件 ──
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot|css|js|map|glb|gltf|bin|ktx2|basis)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ── SSE 反向代理 ──
    # Keep both the V2 assistant route and the V1 compatibility route as
    # dedicated no-buffer locations.  The application also sends
    # X-Accel-Buffering: no, but the proxy must enforce it independently.
    location ^~ /api/ai/assistant/chat-stream {
        proxy_pass http://netops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/ai/chat-stream {
        proxy_pass http://netops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API 反向代理 ──
    # Grafana is kept behind the same origin and requires a valid Nexora
    # session cookie. The internal auth subrequest validates that cookie
    # through the normal backend RBAC boundary before injecting identity.
    location = /_grafana_auth {
        internal;
        proxy_pass http://netops_backend/api/grafana/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length      "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        # Extract only the dedicated Nexora session; do not relay browser cookies.
        proxy_set_header Authorization       "Bearer $cookie_nexora_grafana_session";
        proxy_set_header Cookie              "";
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/ {
        auth_request /_grafana_auth;
        auth_request_set $grafana_auth_user $upstream_http_x_grafana_user;
        auth_request_set $grafana_auth_role $upstream_http_x_grafana_role;
        # Preserve /grafana/ so Grafana can serve from its configured subpath.
        proxy_pass http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana authentication is supplied per request by the trusted
        # Auth Proxy headers. Do not forward stale native Grafana session
        # cookies from the browser; the auth subrequest still validates the
        # separate Nexora cookie before reaching this location.
        proxy_set_header Cookie              "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Replace any client-supplied identity headers with values returned by
        # the authenticated internal subrequest. Grafana trusts the dedicated
        # grafana_auth subnet, so keep only Grafana and Nginx attached to it.
        proxy_set_header X-WEBAUTH-USER     $grafana_auth_user;
        proxy_set_header X-WEBAUTH-ROLE     $grafana_auth_role;
        proxy_set_header Authorization      "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://netops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket (PAM 受控终端) — ^~ 强制最长前缀优先，阻止正则 location 干扰 ──
    location ^~ /api/pam/ws/ {
        proxy_pass http://netops_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── WebSocket (通用，兼容旧路径) ──
    location ^~ /api/ws/ {
        proxy_pass http://netops_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── 前端 SPA 回退 ──
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        expires -1;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── 内部 fallback ──
    location @backend {
        proxy_pass http://netops_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;
}
