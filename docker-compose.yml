name: nexora

# Keep container stdout/stderr bounded even when a service enters a restart
# loop. The local driver is compact and rotates without retaining an
# unbounded JSON log file.
x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: nexora-postgres:latest
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: nexora-db
    command:
      - postgres
      - -c
      - timezone=${TZ:-Asia/Shanghai}
      - -c
      - log_timezone=${TZ:-Asia/Shanghai}
    environment:
      # These variables can be overridden in the .env file
      - TZ=${TZ:-Asia/Shanghai}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-default secret}
      - POSTGRES_DB=${POSTGRES_DB:-netops}
    volumes:
      - nexora-pgdata:/var/lib/postgresql
    shm_size: 256m
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *container-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-netops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  netops:
    image: nexora-netops
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-netops
    # Keep the backend runtime configuration in sync with the deployment
    # .env. Explicit entries in `environment` below override host-specific
    # values that must be different inside Docker (for example DATABASE_URL
    # and ENVIRONMENT).
    env_file:
      - .env
    init: true
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    stop_grace_period: 30s
    expose:
      - "8003"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      # Docker Compose is the production deployment profile. The AI
      # temporary test mode is controlled at runtime and no longer depends on
      # switching ENVIRONMENT in .env.
      - ENVIRONMENT=production
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-default secret}@db:5432/${POSTGRES_DB:-netops}
      # Docker runs the Prometheus-compatible VictoriaMetrics path by default;
      # local development keeps its native PostgreSQL provider unless opted in.
      - MONITORING_METRIC_BACKEND=${MONITORING_METRIC_BACKEND:-victoriametrics}
      - VICTORIAMETRICS_URL=${VICTORIAMETRICS_URL:-http://victoriametrics:8428}
      - VICTORIAMETRICS_ALLOWED_HOSTS=${VICTORIAMETRICS_ALLOWED_HOSTS:-victoriametrics}
      - MONITORING_ARTIFACT_ROOT=/app/artifacts/monitoring
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set to a non-default secret}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set to a non-default secret}
      # AI settings are passed through from the existing .env contract. The
      # temporary test mode itself is runtime-controlled from /ai/security.
      - AI_ENABLED=${AI_ENABLED:-0}
      - EXTERNAL_AI_ENABLED=${EXTERNAL_AI_ENABLED:-0}
      - AI_KILL_SWITCH=${AI_KILL_SWITCH:-0}
      - AI_SECURITY_VAULT_TTL_SECONDS=${AI_SECURITY_VAULT_TTL_SECONDS:-3600}
      - AI_MAX_PAYLOAD_BYTES=${AI_MAX_PAYLOAD_BYTES:-256000}
      - AI_PROVIDER_ALLOWLIST=${AI_PROVIDER_ALLOWLIST:-deepseek,openai,openai_compatible,azure_openai,ollama,local,qwen}
      - AI_DEBUG_PAYLOAD=${AI_DEBUG_PAYLOAD:-0}
      - AI_OUTBOUND_PROXY_URL=${AI_OUTBOUND_PROXY_URL:-}
      - AI_PROVIDER_MAX_CONCURRENCY=${AI_PROVIDER_MAX_CONCURRENCY:-8}
      - AI_TENANT_MAX_CONCURRENCY=${AI_TENANT_MAX_CONCURRENCY:-4}
      - AI_USER_MAX_CONCURRENCY=${AI_USER_MAX_CONCURRENCY:-2}
      - AI_CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS=${AI_CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS:-10}
      - AI_CIRCUIT_FAILURE_THRESHOLD=${AI_CIRCUIT_FAILURE_THRESHOLD:-3}
      - AI_CIRCUIT_COOLDOWN_SECONDS=${AI_CIRCUIT_COOLDOWN_SECONDS:-30}
      - AI_HEALTH_BACKOFF_SECONDS=${AI_HEALTH_BACKOFF_SECONDS:-30}
      - AI_DAILY_BUDGET_USD=${AI_DAILY_BUDGET_USD:-0}
      - AI_EMBEDDING_MODE=${AI_EMBEDDING_MODE:-local}
      - AI_EMBEDDING_DIMENSIONS=${AI_EMBEDDING_DIMENSIONS:-1536}
      - AI_RETRIEVAL_CACHE_ENABLED=${AI_RETRIEVAL_CACHE_ENABLED:-0}
      - AI_RETRIEVAL_TRGM_THRESHOLD=${AI_RETRIEVAL_TRGM_THRESHOLD:-0.35}
      - REQUEST_BODY_MAX_BYTES=${REQUEST_BODY_MAX_BYTES:-157286400}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_MAX_BYTES=${LOG_FILE_MAX_BYTES:-10485760}
      - LOG_FILE_BACKUP_COUNT=${LOG_FILE_BACKUP_COUNT:-5}
      # Windows browsers download the one-click EXE from the Windows release
      # branch; Ubuntu browsers download the local systemd installer.
      - TERMINAL_AGENT_WINDOWS_URL=${TERMINAL_AGENT_WINDOWS_URL:-https://github.com/libing28390-sketch/Release-netops/raw/refs/heads/windows/NexoraTerminalAgent.exe}
      # Optional integration. Empty means /api/templates reads PostgreSQL
      # directly instead of waiting on an external private-network endpoint.
      - CONFIG_MANAGEMENT_URL=${CONFIG_MANAGEMENT_URL:-}
      - CONFIG_MANAGEMENT_TIMEOUT_SECONDS=${CONFIG_MANAGEMENT_TIMEOUT_SECONDS:-1}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-16}
      - DB_POOL_OVERFLOW_MAX=${DB_POOL_OVERFLOW_MAX:-4}
      - DB_POOL_ACQUIRE_TIMEOUT_SECONDS=${DB_POOL_ACQUIRE_TIMEOUT_SECONDS:-10}
      - TEMPLATES_CACHE_TTL_SECONDS=${TEMPLATES_CACHE_TTL_SECONDS:-2}
      - SCHEDULER_MISFIRE_GRACE_SECONDS=${SCHEDULER_MISFIRE_GRACE_SECONDS:-30}
      # Keep one worker by default because the lifespan-owned telemetry loops
      # must run once per deployment, not once per Uvicorn worker process.
      - WORKERS=${WORKERS:-1}
    volumes:
      - nexora-data:/app/data
      - nexora-backup:/app/backup
      - nexora-dist:/app/dist
      - nexora-monitoring-artifacts:/app/artifacts/monitoring
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *container-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    container_name: nexora-victoriametrics
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-90d}"
      - "-httpListenAddr=:8428"
    volumes:
      - nexora-vmdata:/storage
    expose:
      - "8428"
    restart: unless-stopped
    logging: *container-logging
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: nexora-snmp-exporter
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # Start immediately with the checked-in, credential-free bootstrap config.
    # The control plane atomically replaces this runtime file when a collector
    # plan is published, then asks the exporter to reload it.  Waiting for
    # current_version.json here would make a fresh deployment look unhealthy
    # and would block vmagent even though an empty-target config is valid.
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        exec /bin/snmp_exporter --config.file=/etc/snmp_exporter/runtime/snmp_exporter/snmp.yml --web.listen-address=:9116
    volumes:
      - nexora-monitoring-artifacts:/etc/snmp_exporter:ro
    expose:
      - "9116"
    restart: unless-stopped
    depends_on:
      netops:
        condition: service_healthy
    logging: *container-logging
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO-", "http://127.0.0.1:9116/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5

  vmagent:
    image: victoriametrics/vmagent:v1.103.0
    container_name: nexora-vmagent
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    command:
      - "-promscrape.config=/etc/nexora-collector/runtime/vmagent/scrape.yml"
      - "-remoteWrite.url=http://victoriametrics:8428/api/v1/write"
      - "-remoteWrite.tmpDataPath=/var/lib/vmagent"
      - "-remoteWrite.maxDiskUsagePerURL=${VMAGENT_MAX_DISK_USAGE:-10GB}"
      - "-httpListenAddr=:8429"
    volumes:
      - nexora-monitoring-artifacts:/etc/nexora-collector:ro
      - nexora-vmagent-queue:/var/lib/vmagent
    expose:
      - "8429"
    depends_on:
      netops:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      snmp-exporter:
        condition: service_healthy
    restart: unless-stopped
    logging: *container-logging
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO-", "http://127.0.0.1:8429/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.0
    container_name: nexora-grafana
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=${GRAFANA_DEFAULT_TIMEZONE:-Asia/Shanghai}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s/grafana/}
      # Nginx strips /grafana/ in proxy_pass, so Grafana serves its internal
      # root path and uses root_url only for browser-facing links/redirects.
      # Enabling serve_from_sub_path here would make both layers add the
      # prefix and cause an endless redirect loop.
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SECURITY_ALLOW_EMBEDDING=${GRAFANA_ALLOW_EMBEDDING:-true}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # Grafana's Prometheus datasource is an internal Docker request. Do not
      # let host-wide proxy variables turn victoriametrics:8428 into an
      # external proxy request (which returns 502 for private service names).
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - NO_PROXY=localhost,127.0.0.1,victoriametrics,grafana,snmp-exporter,vmagent
      - no_proxy=localhost,127.0.0.1,victoriametrics,grafana,snmp-exporter,vmagent
    volumes:
      - nexora-grafana-data:/var/lib/grafana
      # Mount only the directories owned by this release. Mounting the whole
      # provisioning directory hides Grafana's image-provided plugins,
      # alerting, and access-control directories and produces misleading
      # "directory not found" startup errors.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      victoriametrics:
        condition: service_healthy
    restart: unless-stopped
    logging: *container-logging
    healthcheck:
      # Grafana's official 12.1.0 image includes curl. Use a fail-fast probe
      # so a missing/failed HTTP request is reflected in the container state.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nexora-nginx
    build:
      context: ./nginx
    container_name: nexora-nginx
    init: true
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    stop_grace_period: 15s
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TLS_COMMON_NAME=${TLS_COMMON_NAME:-localhost}
      # Production does not need an outbound proxy for the reverse proxy.
      # Explicitly clear host/Docker-injected proxy variables so internal
      # health checks never get sent to an external proxy.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nexora-dist:/usr/share/nginx/html:ro
      # The entrypoint generates a fallback self-signed certificate when absent.
      # Existing trusted certificates are preserved and used as-is.
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      netops:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *container-logging
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO-", "http://netops:8003/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4.2-alpine
    container_name: nexora-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -ec
    # Keep the complete shell program in one argv element. A scalar command can
    # be split into `umask`, `077`, ... by Compose, causing `sh -ec` to execute
    # only `umask` (which prints 0022) and exit without starting Redis.
    command:
      - |
        umask 077
        if [ -n "$$REDIS_PASSWORD" ]; then
          password_hash="$(printf '%s' "$$REDIS_PASSWORD" | sha256sum | awk '{print $$1}')"
          printf 'user default off\nuser nexora on #%s ~nexora:* ~ai:ratelimit:* +ping +get +set +incr +del +eval +scan\n' "$$password_hash" > /data/nexora-users.acl
        else
          printf 'user default off\nuser nexora on nopass ~nexora:* ~ai:ratelimit:* +ping +get +set +incr +del +eval +scan\n' > /data/nexora-users.acl
        fi
        exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --maxmemory 512mb \
          --maxmemory-policy allkeys-lru --protected-mode yes --aclfile /data/nexora-users.acl
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - nexora-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli --user nexora -a "$${REDIS_PASSWORD}" ping | grep -q PONG;
          else redis-cli --user nexora ping | grep -q PONG; fi
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *container-logging

volumes:
  nexora-data:
    name: nexora-data
  nexora-backup:
    name: nexora-backup
  nexora-pgdata:
    name: nexora-pgdata
  nexora-dist:
    name: nexora-dist
  nexora-redis-data:
    name: nexora-redis-data
  nexora-vmdata:
    name: nexora-vmdata
  nexora-vmagent-queue:
    name: nexora-vmagent-queue
  nexora-monitoring-artifacts:
    name: nexora-monitoring-artifacts
  nexora-grafana-data:
    name: nexora-grafana-data
