name: nexora

services:
  db:
    image: postgres:17-alpine
    container_name: nexora-db
    environment:
      # These variables can be overridden in the .env file
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-netops}
    volumes:
      - nexora-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  netops:
    image: nexora-netops
    build: .
    container_name: nexora-netops
    expose:
      - "8003"
    environment:
      - NODE_ENV=production
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-netops}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-change-me-to-a-random-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Keep one worker by default because the lifespan-owned telemetry loops
      # must run once per deployment, not once per Uvicorn worker process.
      - WORKERS=${WORKERS:-1}
    volumes:
      - nexora-data:/app/data
      - nexora-backup:/app/backup
      - nexora-dist:/app/dist
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nexora-nginx
    build:
      context: ./nginx
    container_name: nexora-nginx
    environment:
      - TLS_COMMON_NAME=${TLS_COMMON_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nexora-dist:/usr/share/nginx/html:ro
      # The entrypoint generates a fallback self-signed certificate when absent.
      # Existing trusted certificates are preserved and used as-is.
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      netops:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nexora-data:
    name: nexora-data
  nexora-backup:
    name: nexora-backup
  nexora-pgdata:
    name: nexora-pgdata
  nexora-dist:
    name: nexora-dist
