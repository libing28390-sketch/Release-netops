task_id: CAT-006
priority: P0
owner: NET+AI
milestone: M2
status: reviewed_sample_pending_catalog_migration
authority:
  vendor_scope: GOV-008
  official_allowlist: CAT-001
  source_taxonomy: CAT-002
  canonical_identity_contract: DB-006
  source_authority: Cisco Documentation

vendor:
  vendor_id: cisco
  display_name: Cisco
  status: active
  catalog_scope: tenant-default-reviewed-seed

product_family:
  code: catalyst_9300
  display_name: Catalyst 9300
  status: active
  description: Cisco Catalyst 9300 campus switching family.
  source_kind: product_page
  canonical_source:
    source_ref: cat001:cisco:www:catalog-9300-product-page
    url: https://www.cisco.com/c/en/us/products/switches/catalyst-9300-series-switches/index.html
  product_series:
    - code: c9300
      display_name: Catalyst 9300
      status: active
      model_code_rule: '^C9300(?:-[0-9]{2}(?:[A-Z])?(?:-[A-Z0-9]+)*)?$'
      product_identity_is_orthogonal_to:
        - cli_platform
        - connection_driver
        - software_train
        - software_version
      model_samples:
        - model_code: C9300-24T
          display_name: Catalyst C9300-24T
          status: draft
          review_status: sample_pending_exact_sku_capture
          source_refs:
            - cat001:cisco:www:catalog-9300-product-page
        - model_code: C9300-48P
          display_name: Catalyst C9300-48P
          status: draft
          review_status: sample_pending_exact_sku_capture
          source_refs:
            - cat001:cisco:www:catalog-9300-product-page
          legacy_compatibility_evidence:
            - tmp/spreadsheet-audit/patch_template.mjs
            - src/components/DeviceFormModal.tsx
        - model_code: C9300-48U
          display_name: Catalyst C9300-48U
          status: draft
          review_status: sample_pending_exact_sku_capture
          source_refs:
            - cat001:cisco:www:catalog-9300-product-page

software_scope:
  primary_version: 17.9.x
  compatibility_version: 17.18.x
  os_family: IOS-XE
  software_train: IOS-XE
  rule: >-
    IOS-XE release scope narrows document applicability but never becomes a
    product family, series, model, vendor, or network-driver parent.
  unknown_version: quarantine_and_require_review

platform_binding_advisory:
  platform_code: cisco_ios
  connection_driver: cisco_ios
  parser_platform: cisco_ios
  driver_authority: false
  execution_write_authority: false
  note: >-
    The binding is an advisory retrieval/parser compatibility hint only. It
    cannot authorize a device, select credentials, or issue a write command.

identity_rules:
  canonical_code_case: preserve_model_code_case
  vendor_resolution: explicit_cisco_only
  family_resolution: exact_catalyst_9300
  series_resolution:
    exact_and_reviewed_aliases: [C9300, Catalyst93, Catalyst 9300]
    result: series_candidate_only
  model_resolution:
    full_model_code_required_for_unique_identity: true
    partial_prefix_result: candidate_list_and_clarification
    unknown_model_result: UNKNOWN_and_no_vendor_or_driver_guess
  alias_candidates:
    status: pending_CAT-009_CAT-011_review
    values: [C9300, Catalyst93, Catalyst 9300]
  ambiguity:
    no_first_match_fallback: true
    return_candidates: true
    require_manual_clarification: true

source_refs:
  - source_ref: cat001:cisco:www:catalog-9300-product-page
    source_type: product_page
    url: https://www.cisco.com/c/en/us/products/switches/catalyst-9300-series-switches/index.html
    path_scope: /c/en/us/products/switches/catalyst-9300-series-switches/
  - source_ref: cat001:cisco:www:command-reference-17-9
    source_type: command_reference
    url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/command_reference/b_179_9300_cr/system_management_commands.html
    path_scope: /c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/
  - source_ref: cat001:cisco:www:command-reference-17-18
    source_type: command_reference
    url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-18/command_reference/b_1718_9300_cr/system_management_commands.html
    path_scope: /c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-18/

activation_gate:
  catalog_rows: reviewed_seed_only_until_DB006_migration
  model_status: draft_until_exact_source_version_and_conflict_review
  required_before_active:
    - tenant_scoped_vendor_and_parent_ids
    - exact_model_code_evidence
    - duplicate_and_ambiguous_model_report
    - CAT-009_alias_conflict_result
    - CAT-011_manual_resolution_state
  forbidden:
    - infer_vendor_from_model_string
    - infer_driver_from_alias
    - create_family_or_series_from_unreviewed_free_text
    - rewrite_v1_ai_document_metadata

rollback:
  runtime: disable_cat006_catalog_reads_and_use_v1_advisory_resolver
  data: retain_reviewed_seed_artifact_and_all_v1_metadata
  production_ddl: none_in_CAT-006
