metrics:
  retrieval_accuracy: exact set equality between returned storage document ids and expected ids; no-match is correct only when result set is empty
  wrong_vendor_rate: cases with an explicit expected vendor whose returned result contains a different vendor
  version_conflict_rate: cases with an expected CLI platform whose returned result contains a different platform
  citation_accuracy: macro precision of returned document ids against gold citation ids; empty gold/no-match is one correct outcome
  latency_ms: wall-clock local retrieval latency measured around RAGRetriever.search; report average, p50, p95, max
