schema_version: 1
dataset_id: nexora-ai-dialog-remediation-v1-20260901
status: frozen
purpose: "离线验证 AI 对话的意图、澄清、知识边界、工具安全和 Provider 覆盖；不携带真实凭据，不访问外网。"
source_policy:
