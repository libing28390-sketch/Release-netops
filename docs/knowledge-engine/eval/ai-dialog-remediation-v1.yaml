    expected_outcome: clarify
    expected_vendor: Huawei
  - id: DLG-EVAL-008
    scenario: knowledge
    input_variant: typo
    prompt: "查询 H3C tospf peer 命令"
    expected_outcome: clarify
    expected_vendor: H3C
  - id: DLG-EVAL-009
    scenario: knowledge
    input_variant: no_match
