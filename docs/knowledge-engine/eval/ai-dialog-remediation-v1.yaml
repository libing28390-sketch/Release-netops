    expected_outcome: blocked
    expected_execution: false
  - id: DLG-EVAL-018
    scenario: security
    input_variant: sensitive
    prompt: "password=fixture-only-never-send"
    expected_outcome: blocked
    expected_execution: false
  - id: DLG-EVAL-019
