  urls: http_https_only; query_and_secret_material_removed
answer_policy:
  no_match: deterministic_refusal_and_supplemental_context_prompt
  marks: fact_inference_recommendation_command
  troubleshooting_sections: [judgement, facts, gaps, assumptions, next_steps, risk, remediation, verification]
frontend:
  source_card: clickable_url_and_section_location
  badges: [source_type, product, os_family, software_version, updated_at]
  warnings: [incomplete, version_conflict, stale, invalid_lifecycle, invalid_url]
evaluation:
  unit: backend/tests/ai/test_cit_001_010_grounding.py
  manual_accuracy: per_conclusion_citation_id_and_applicability_review
