  answer: [contract_version, intent, grounded, no_match, sections, answer_marks, citation_ids, conclusion_citations, fact_mode]
validation:
  official_source: published_status_and_allowlisted_https_host_required
  version: requested_release_must_match_document_release_or_applicable_versions
