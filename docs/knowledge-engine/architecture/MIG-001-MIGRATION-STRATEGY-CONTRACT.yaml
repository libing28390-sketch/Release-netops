task_id: MIG-001
title: Document, Metadata, Chunk, and Embedding migration strategy
original_requirement: "按 Document、Metadata、Chunk、Embedding 分别确定迁移策略。"
status: frozen_for_execution_planning
authority: PostgreSQL
sqlite: forbidden_for_acceptance
automatic_migration_allowed: false
production_cutover: prohibited_until_all_layer_gates_pass

principles:
  - source_facts_before_derived_data
  - preserve_v1_and_original_bytes_until_release_retention_gate
  - inventory_is_read_only_and_scope_ambiguous_stops_migration
  - unknown_or_conflicting_rows_are_quarantined_not_guessed
  - every_derived_generation_has_hash_contract_and_rollback_pointer
  - tenant_and_acl_scope_is_reconciled_before_activation

layers:
  document:
    legacy_authority: [ai_document.original_content, ai_document.source, ai_document.content_hash]
    v2_target: [kb_document, kb_document_version]
    confidence_grade: C
    strategy: preserve_original_bytes_hash_first_then_append_immutable_version
    migration_mode: inventory_then_transactional_backfill_then_shadow_read
    allowed_actions:
      - capture_postgresql_row_schema_tenant_and_hash_inventory
      - retain_original_content_or_verified_content_reference
      - create_stable_document_identity_and_version_lineage
      - record_source_registry_and_source_version_provenance
      - quarantine_missing_hash_source_acl_or_integrity_failures
    forbidden_actions:
      - overwrite_legacy_original_content
      - derive_identity_from_file_path_or_acl_json
      - activate_without_source_hash_and_tenant_scope
      - delete_v1_document_rows_before_release_retention_gate
    acceptance:
      - source_hash_match_100_percent_or_explicit_quarantine
      - immutable_version_fact_guard_present
      - zero_cross_tenant_source_or_document_links
      - v1_read_adapter_and_rollback_verified
    rollback: disable_v2_document_reads_and_restore_v1_adapter

  metadata:
    legacy_authority: [ai_document.metadata_json, ai_document.semantic_columns, front_matter, source_metadata]
    v2_target: [kb_document_version.metadata_json, kb_document_version.metadata_hash, kb_document_product, kb_document_software]
    confidence_grade: B
    strategy: validate_normalize_hash_and_quarantine_unknown
    migration_mode: derived_reconciliation_after_document_version
    allowed_actions:
      - preserve_original_metadata_json_as_input_evidence
      - parse_with_pinned_parser_and_schema_version
      - normalize_vendor_product_os_software_and_cli_platform
      - reconcile_acl_trust_and_tenant_scope
      - calculate_reproducible_metadata_hash
      - classify_active_reviewed_quarantined_or_invalid
    forbidden_actions:
      - treat_free_text_or_directory_path_as_canonical_scope
      - infer_unknown_vendor_product_or_version
      - place_tenant_identity_acl_or_secret_in_metadata_json
      - promote_invalid_or_conflicting_rows_to_active
    acceptance:
      - active_metadata_required_field_completeness_100_percent
      - invalid_conflict_and_unknown_rows_excluded_from_retrieval
      - metadata_hash_reproducible_for_same_input
      - v1_metadata_projection_remains_readable
    rollback: retain_original_metadata_json_and_disable_typed_projection

  chunk:
    legacy_authority: [ai_document_chunk.content, ai_document_chunk.raw_content, ai_document_chunk.content_hash]
    v2_target: [kb_chunk_version, kb_chunk, kb_chunk_edge]
    confidence_grade: B
    strategy: rebuild_from_trusted_document_version_with_new_generation
    migration_mode: generation_build_then_fidelity_shadow_then_atomic_index_cutover
    allowed_actions:
      - require_active_verified_document_version_and_content_hash
      - create_append_only_chunk_generation_with_pinned_chunker
      - preserve_raw_embedding_content_locator_role_parent_and_hash
      - validate_orphan_duplicate_cycle_and_stale_generation_boundaries
      - keep_failed_generation_non_retrievable
    forbidden_actions:
      - copy_chunks_without_source_version_hash
      - infer_neighbors_from_ordinal_only
      - activate_failed_or_partial_generation
      - delete_legacy_chunks_before_v2_fidelity_gate
    acceptance:
      - zero_orphan_duplicate_or_cycle_rows_in_active_generation
      - required_structural_fidelity_100_percent
      - failed_generation_excluded_from_retrieval
      - previous_ready_generation_or_v1_rollback_available
    rollback: mark_new_generation_failed_or_superseded_and_restore_previous_ready_pointer

  embedding:
    legacy_authority: [ai_document_chunk.embedding, ai_document_chunk.embedding_model, ai_document_chunk.embedding_dimensions, ai_document_chunk.embedding_version]
    v2_target: [kb_embedding_model, kb_chunk_embedding, kb_index_version]
    confidence_grade: C
    strategy: do_not_copy_legacy_vectors_recompute_under_pinned_contract
    migration_mode: provider_contract_freeze_then_bounded_recompute_then_shadow_compare
    allowed_actions:
      - pin_provider_model_dimension_mode_and_contract_version
      - embed_only_verified_active_chunk_generation
      - validate_dimension_vector_hash_model_and_index_version
      - use_security_gateway_for_any_external_embedding_request
      - compare_recall_latency_and_tenant_acl_results_before_cutover
    forbidden_actions:
      - treat_json_text_vector_as_pgvector_authority
      - copy_unknown_or_dimension_mismatched_vectors
      - send_raw_secret_or_untrusted_payload_outside_gateway
      - mutate_ready_vectors_in_place
    acceptance:
      - vector_dimension_match_100_percent
      - model_contract_compatibility_100_percent
      - no_untracked_or_cross_tenant_vectors
      - shadow_recall_and_latency_non_regression_report_approved
    rollback: restore_previous_ready_index_generation_or_local_lexical_fallback

execution_order:
  - W0_authoritative_postgresql_inventory
  - W1_document_source_and_version_lineage
  - W2_metadata_reconciliation_and_quarantine
  - W3_chunk_generation_rebuild_and_fidelity
  - W4_embedding_recompute_and_shadow_cutover
  - W5_release_retention_cleanup_after_explicit_approval

gates:
  prerequisites: [AUD-023-confidence-grading, DB-017-migration-order, EVAL-020-security-gate]
  each_wave_requires: [tenant_scope, hash_manifest, counts, redacted_error_report, checkpoint, rollback_pointer]
  production_database_writes: release_gated_transaction_only
  v1_compatibility: preserve_ai_document_ai_document_chunk_and_v1_routes_until_REL_gate

evidence:
  contract: docs/knowledge-engine/architecture/MIG-001-MIGRATION-STRATEGY-CONTRACT.yaml
  runner: scripts/knowledge_engine_v2_mig001_strategy_check.py
  report: docs/knowledge-engine/eval/mig-001-strategy-v1.json
  test: tests/knowledge_engine_v2/test_mig001_strategy.py
