task_id: EVAL-003
title: query-type boundary coverage
priority: P0
status: executable
authority: offline_fixture
scope:
  - cover Exact, Alias, Prefix, Ambiguous, Typo, Wrong Vendor and Product Conflict
  - assert positive cases return answer with citations and Gold fixtures
  - assert ambiguous cases clarify without guessing a vendor
  - assert wrong-vendor and product-conflict cases fail closed with no Gold document
  - preserve the EVAL-001 frozen case identities and labels
coverage:
  manifest: docs/knowledge-engine/eval/eval-query-type-coverage-v1.yaml
  manifest_report: docs/knowledge-engine/eval/eval-query-type-coverage-v1.manifest.json
  parent_dataset: docs/knowledge-engine/eval/eval-query-dataset-v1.yaml
  parent_dataset_id: nexora-kb-eval-v1-20260817
  query_types: [exact, alias, prefix, ambiguous, typo, wrong_vendor, product_conflict]
  cases_per_type: 12
  positive_types: [exact, alias, prefix, typo]
  clarify_types: [ambiguous]
  fail_closed_types: [wrong_vendor, product_conflict]
invariants:
  - Exact/Alias/Prefix/Typo cases are answerable, cited and have non-empty Gold IDs
  - Ambiguous cases have no vendor/product identity and require clarification
  - Wrong Vendor cases contain conflicting vendor syntax and return no match
  - Product Conflict cases contain the expected series and the other vendor model and return no match
  - every case type has exactly 12 examples across the frozen dataset
  - query text and serialized labels contain no credentials or tenant/ACL payload
safety:
  database: none
  sqlite: not_used
  external_network: forbidden
  secrets: forbidden
  production_writes: forbidden
verification:
  validator: scripts/knowledge_engine_v2_eval_query_type_coverage_check.py
  focused_test: tests/knowledge_engine_v2/test_eval003_query_type_coverage.py
  commands:
    - "$env:PYTHONPATH='backend'; .venv\\Scripts\\python.exe scripts/knowledge_engine_v2_eval_query_type_coverage_check.py"
    - "$env:PYTHONPATH='backend'; .venv\\Scripts\\python.exe -m pytest tests/knowledge_engine_v2/test_eval003_query_type_coverage.py -q -p no:cacheprovider"
    - ".venv\\Scripts\\python.exe -m py_compile scripts/knowledge_engine_v2_eval_query_type_coverage_check.py tests/knowledge_engine_v2/test_eval003_query_type_coverage.py"
    - "git diff --check"
  required_results:
    - status: PASS
    - all_query_types_count: 12
    - ambiguous_outcome: clarify
    - wrong_vendor_outcome: no_match
    - product_conflict_outcome: no_match
    - database: none
    - sqlite: not_used
rollback:
  runtime: remove EVAL-003 type coverage selection while retaining the frozen parent dataset
  data: delete the coverage YAML, report, validator and test in a documentation-only commit
  database: none; no tables, migrations or persistent rows are created
  compatibility: V1 retrieval and response contracts remain unchanged
