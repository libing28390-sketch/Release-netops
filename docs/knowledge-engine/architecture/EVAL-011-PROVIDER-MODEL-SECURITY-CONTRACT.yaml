task_id: EVAL-011
title: Provider CRUD, model switching, fallback, permission and key-security coverage
priority: P0
status: executable
authority: PostgreSQL
scope:
  provider_crud:
    cases: [create, list, update, disable, delete_preview, duplicate_name]
  model_switching:
    cases: [multiple_providers, multiple_models, user_default, scene_route, preference_update]
  fallback:
    cases: [primary_enabled, fallback_enabled, capability_compatibility, classification_compatibility, circuit_open]
  permission:
    cases: [tenant_acl, role_acl, user_acl, unauthorized_model_hidden, cross_tenant_rejected]
  key_security:
    cases: [master_key_required, aes_256_gcm, masked_response, rotation_audit, invalidation, secret_redaction]
  error_contract:
    cases: [stable_auth, rate_limit, timeout, network, invalid_request, model_not_found, circuit_open, quota]
authoritative_plan: docs/knowledge-engine/architecture/LLM-001-037-POSTGRES-TEST-PLAN.yaml
database_policy:
  required_database: PostgreSQL
  required_extensions: [vector, pg_trgm]
  sqlite: forbidden
  persistence_probe_transaction: rollback
  production_write: false
verification:
  postgres_probe: scripts/knowledge_engine_v2_llm_pg_probe.py
  backend_contract_tests: backend/tests/ai/test_llm_001_037_multi_provider.py
  security_contract_tests:
    - backend/tests/ai/test_sec_001_020_security_gateway.py
    - backend/tests/ai/test_security_gateway.py
  api_contract_tests: backend/tests/ai/test_api_v2_contracts.py
  coverage_validator: scripts/knowledge_engine_v2_eval011_provider_model_security_check.py
  focused_test: tests/knowledge_engine_v2/test_eval011_provider_model_security.py
  commands:
    - "$env:DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/netops'; $env:PYTHONPATH='backend'; .venv\\Scripts\\python.exe scripts/knowledge_engine_v2_llm_pg_probe.py"
    - "$env:DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/netops'; $env:PYTHONPATH='backend'; .venv\\Scripts\\pytest.exe backend/tests/ai/test_llm_001_037_multi_provider.py backend/tests/ai/test_sec_001_020_security_gateway.py backend/tests/ai/test_security_gateway.py backend/tests/ai/test_api_v2_contracts.py -q -p no:cacheprovider"
    - "$env:DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/netops'; $env:PYTHONPATH='backend'; .venv\\Scripts\\pytest.exe tests/knowledge_engine_v2/test_eval011_provider_model_security.py -q -p no:cacheprovider"
    - "npm.cmd run lint"
    - "npm.cmd run build"
    - "git diff --check"
required_results:
  - postgres_probe_status: PASS
  - rollback: true
  - provider_model_security_contract_tests: PASS
  - no_plaintext_api_key_response: true
  - sqlite_acceptance_evidence: false
  - v1_baseline: unchanged
rollback:
  application: disable_new_provider_or_model_route_and_use_existing_v1_default_route
  database: probe_transaction_rollback
  data_loss: forbidden
