task_id: CAT-001
priority: P0
owner: NET+AI
milestone: M2
status: frozen_for_implementation
authority: official_vendor_documentation
contract_version: v1.0
depends_on: [GOV-008, DB-008]

decision:
  choice: exact_https_host_and_path_allowlist
  summary: >-
    The first catalog batch accepts only official Huawei and Cisco
    documentation entries for the frozen CloudEngine 6800/VRP8 and Catalyst
    9300/IOS-XE scope. Every request is default-deny and must match an exact
    HTTPS host plus an explicitly registered path prefix. Vendor trust never
    grants network, tenant, or device authorization.
  invariants:
    - only_huawei_and_cisco_are_in_first_batch
    - unknown_vendor_or_source_id_fails_closed
    - exact_https_host_and_registered_path_are_required
    - wildcard_hosts_and_open_path_prefixes_are_forbidden
    - redirects_must_revalidate_against_the_same_allowlist
    - query_userinfo_fragment_and_credentials_are_forbidden
    - source_allowlist_does_not_authorize_devices_or_write_commands

policy:
  default_deny: true
  schemes: [https]
  ports: [443]
  exact_host_match: true
  wildcard_hosts: forbidden
  userinfo: forbidden
  fragments: forbidden
  query_parameters: none_by_default
  redirect_policy:
    revalidate_every_hop: true
    same_vendor_entry_required: true
    same_host_required: true
    path_must_remain_registered: true
    https_downgrade: forbidden
  network_safety_delegation: DB-008_url_and_ssrf_gate
  collection_state: draft_until_CAT-003_registry_activation_and_CAT-004_security_gate

vendor_entries:
  - vendor: Huawei
    vendor_key: huawei
    product_family: CloudEngine 6800
    model_pattern: CE68xx
    platform_code: huawei_vrp
    os_family: VRP8
    primary_version: V300R024C10SPC500
    compatibility_version: V300R023C00SPC500
    official_hosts:
      - host: support.huawei.com
        path_prefixes:
          - /enterprise/en/doc/EDOC1100463796/
          - /enterprise/en/doc/EDOC1100463785/
          - /enterprise/en/switches/
        source_urls:
          - https://support.huawei.com/enterprise/en/doc/EDOC1100463796/2a5291b7/configuration-precautions-for-vxlan
          - https://support.huawei.com/enterprise/en/doc/EDOC1100463785/a01f202f/md-cli-maintenance-operations
          - https://support.huawei.com/enterprise/en/switches/ce6860-san-pid-252423549
      - host: info.support.huawei.com
        path_prefixes:
          - /enterprise/en/doc/EDOC1100463810/
          - /enterprise/en/doc/EDOC1100439391/
        source_urls:
          - https://info.support.huawei.com/enterprise/en/doc/EDOC1100463810/cf4a113d/overview-of-pim
          - https://info.support.huawei.com/enterprise/en/doc/EDOC1100439391/69a4eddd/documentation-conventions
    source_authority: Huawei Enterprise Support
    allowed_source_kinds: [product_support, configuration_guide, command_reference, release_note]
    forbidden_hosts: [huawei.com, www.huawei.com, download.huawei.com]

  - vendor: Cisco
    vendor_key: cisco
    product_family: Catalyst 9300
    model_pattern: C9300
    platform_code: cisco_ios
    os_family: IOS-XE
    primary_version: 17.9.x
    compatibility_version: 17.18.x
    official_hosts:
      - host: www.cisco.com
        path_prefixes:
          - /c/en/us/products/switches/catalyst-9300-series-switches/
          - /c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/
          - /c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-18/
        source_urls:
          - https://www.cisco.com/c/en/us/products/switches/catalyst-9300-series-switches/index.html
          - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/command_reference/b_179_9300_cr/system_management_commands.html
          - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-18/command_reference/b_1718_9300_cr/system_management_commands.html
    source_authority: Cisco Documentation
    allowed_source_kinds: [product_support, product_page, configuration_guide, command_reference, release_note]
    forbidden_hosts: [cisco.com, developer.cisco.com, learningnetwork.cisco.com]

source_record_contract:
  required_fields: [source_id, vendor, product_family, canonical_url, host, path_prefix, source_kind, product_scope, version_scope, trust_level, status]
  trust_level: official
  initial_status: draft
  source_id_immutable: true
  canonical_url_rules:
    absolute: true
    lowercase_scheme_and_host: true
    remove_userinfo: true
    fragment_forbidden: true
    host_must_match_registered_entry: true
    path_must_start_with_registered_prefix: true
  audit_fields: [reviewer, reviewed_at, evidence_url, content_hash, terms_review_status]
  secrets_forbidden: [password, api_key, bearer_token, cookie, device_credential]

acceptance:
  - exactly_two_first_batch_vendors
  - every_source_url_is_https_and_matches_an_exact_registered_host_and_path
  - unknown_host_scheme_port_vendor_and_path_fail_closed
  - redirects_are_revalidated_per_hop
  - primary_and_compatibility_version_scope_is_present_for_each_vendor
  - no_device_write_or_credential_authorization_is_implied
  - V1_governance_source_urls_remain_preserved_as_reviewed_inputs

rollback:
  runtime: disable_CAT_source_collection_and_keep_V1_source_hints_read_only
  data: preserve_reviewed_source_records_and_do_not_delete_existing_v1_source_text
  activation: CAT-003/CAT-004 must not activate a row that fails this contract

next_tasks: [CAT-002, CAT-003, CAT-004]
