gates:
  schema: [m0142, m0143, m0144, jsonb_finding_categories, tenant_incident_index, no_raw_payload_columns]
  security: [default_deny, secret_block, gateway_boundary, tenant_scope, metadata_only_audit, kill_switch]
  copilot: [copilot_v2_contract, stream_abort_recovery, durable_feedback, context_budget, case_handoff, role_navigation]
  diagnostics: [state_machine, cmdb_identity, explicit_platform_commands, read_only_authorization, bounded_timeout_concurrency, minimized_evidence, stable_errors, no_write_path]
rollback:
