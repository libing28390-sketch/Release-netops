role_permissions:
  Administrator:
    all_ai_permissions: true
  Operator:
    includes:
      - ai.view
      - ai.use
      - ai.assistant
      - ai.audit.view
      - ai.agent.use
    excludes:
      - ai.provider.manage
      - ai.model.manage
      - ai.prompt.manage
      - ai.knowledge.manage
  Viewer:
    includes:
      - ai.view
      - ai.command_explain
      - ai.config_analyze
      - ai.diff_analyze
      - ai.alarm_analyze
    excludes:
      - ai.assistant
      - ai.agent.use
      - ai.provider.manage
      - ai.model.manage
      - ai.prompt.manage
      - ai.knowledge.manage
      - ai.audit.view
frontend_nav:
  ai_center_min_role: Viewer
  required_role_items:
    - ai-security: Administrator
  unguarded_items:
    - ai-providers
    - ai-models
    - ai-prompts
    - ai-copilot
    - ai-agents
    - ai-knowledge
    - ai-governance
    - ai-usage
page_permission_source:
  AiCenterPage_receives_current_user: false
  management_tabs_use_permission_hook: false
  direct_route_guard: false
endpoint_matrix:
  providers:
    list: ai.provider.manage
    write: ai.provider.manage
  models:
    list: ai.view
    write: ai.model.manage
  prompts:
    list: ai.view
    write: ai.prompt.manage
  agents:
    list_and_trace: ai.view
    run_and_cancel: ai.agent.use
  knowledge:
    read: ai.view
    write: ai.knowledge.manage
  security:
    read_and_dry_run: ai.audit.view
    write_and_kill_switch: ai.provider.manage
  copilot:
    chat: ai.assistant
