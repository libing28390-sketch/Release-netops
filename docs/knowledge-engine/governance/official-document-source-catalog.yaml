review_requirements:
  before_registration:
    - 确认 canonical_url 仍由对应官方主机提供，且未跳转到未审核主机。
    - 确认产品系列、网络操作系统和版本范围与元数据一致。
    - 检查版权、robots、登录权限和自动化访问条款。
    - 为具体 URL 或精确路径前缀完成 CAT-001 增量审核。
    - 故障排查来源先完成 CAT-002 troubleshooting_guide 类型扩展。
  before_collection:
    - 使用安全出站 HTTP 客户端，阻止私网、回环、链路本地地址和未审核重定向。
    - 计算正文哈希并按 canonical_url、document_id 和 content_hash 去重。
    - 保留 vendor、product_scope、version_scope、language、source_url 和 retrieved_at 元数据。
    - 先小批量采集并通过隔离区、清洗、分块、嵌入和召回验收，再扩大范围。
