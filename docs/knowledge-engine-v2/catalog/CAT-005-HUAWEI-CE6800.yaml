task_id: CAT-005
priority: P0
owner: NET+AI
milestone: M2
status: reviewed_sample_pending_catalog_migration
authority:
  vendor_scope: GOV-008
  official_allowlist: CAT-001
  source_taxonomy: CAT-002
  canonical_identity_contract: DB-006
  source_authority: Huawei Enterprise Support

vendor:
  vendor_id: huawei
  display_name: Huawei
  status: active
  catalog_scope: tenant-default-reviewed-seed

product_family:
  code: cloudengine_6800
  display_name: CloudEngine 6800
  status: active
  description: Huawei CloudEngine 6800 data-center switch family.
  source_kind: product_page
  canonical_source:
    source_ref: cat001:huawei:support:ce6860-san-product-page
    url: https://support.huawei.com/enterprise/en/switches/ce6860-san-pid-252423549
  product_series:
    - code: ce6800
      display_name: CloudEngine 6800
      status: active
      model_code_rule: '^CE68[0-9]{2}(?:-[A-Z0-9]+(?:-[A-Z0-9]+)*)?$'
      product_identity_is_orthogonal_to:
        - cli_platform
        - connection_driver
        - software_train
        - software_version
      model_samples:
        - model_code: CE6860-SAN
          display_name: CloudEngine CE6860 SAN
          status: draft
          review_status: sample_pending_exact_sku_capture
          source_refs:
            - cat001:huawei:support:ce6860-san-product-page
          notes: >-
            The CAT-001 product-page path provides the reviewed CE6860 SAN
            family evidence; activation waits for a versioned source record
            that captures the exact manufacturer model code.
        - model_code: CE6885-48YS8CQ
          display_name: CloudEngine CE6885-48YS8CQ
          status: draft
          review_status: sample_pending_exact_sku_capture
          source_refs:
            - cat001:huawei:support:ce6860-san-product-page
          legacy_compatibility_evidence:
            - docs/knowledge-engine-v2/eval/v1-baseline-cases.yaml
            - backend/tests/ai/test_rag_acceptance_v2.py
        - model_code: CE6881-48S6CQ
          display_name: CloudEngine CE6881-48S6CQ
          status: draft
          review_status: sample_pending_exact_sku_capture
          source_refs:
            - cat001:huawei:support:ce6860-san-product-page

software_scope:
  primary_version: V300R024C10SPC500
  compatibility_version: V300R023C00SPC500
  os_family: VRP8
  software_train: V300
  rule: >-
    A software version narrows document applicability but never becomes a
    product family, series, model, vendor, or network-driver parent.
  unknown_version: quarantine_and_require_review

platform_binding_advisory:
  platform_code: huawei_vrp
  connection_driver: huawei_vrp
  parser_platform: huawei_vrpv8
  driver_authority: false
  execution_write_authority: false
  note: >-
    The binding is an advisory retrieval/parser compatibility hint only. It
    cannot authorize a device, select credentials, or issue a write command.

identity_rules:
  canonical_code_case: preserve_model_code_case
  vendor_resolution: explicit_huawei_only
  family_resolution: exact_cloudengine_6800
  series_resolution:
    exact_and_reviewed_aliases: [CE6800, CE68, CE68XX, CloudEngine 6800]
    result: series_candidate_only
  model_resolution:
    full_model_code_required_for_unique_identity: true
    partial_prefix_result: candidate_list_and_clarification
    unknown_model_result: UNKNOWN_and_no_vendor_or_driver_guess
  alias_candidates:
    status: pending_CAT-009_CAT-011_review
    values: [CE68, CE6800, CE68XX, CloudEngine 6800]
  ambiguity:
    no_first_match_fallback: true
    return_candidates: true
    require_manual_clarification: true

source_refs:
  - source_ref: cat001:huawei:support:ce6860-san-product-page
    source_type: product_page
    url: https://support.huawei.com/enterprise/en/switches/ce6860-san-pid-252423549
    path_scope: /enterprise/en/switches/
  - source_ref: cat001:huawei:support:ce6860-san-product-page
    source_type: official_url
    url: https://support.huawei.com/enterprise/en/switches/ce6860-san-pid-252423549
    path_scope: /enterprise/en/switches/
  - source_ref: cat001:huawei:support:vxlan-guide
    source_type: configuration_guide
    url: https://support.huawei.com/enterprise/en/doc/EDOC1100463796/2a5291b7/configuration-precautions-for-vxlan
    path_scope: /enterprise/en/doc/EDOC1100463796/
  - source_ref: cat001:huawei:support:md-cli-guide
    source_type: command_reference
    url: https://support.huawei.com/enterprise/en/doc/EDOC1100463785/a01f202f/md-cli-maintenance-operations
    path_scope: /enterprise/en/doc/EDOC1100463785/

activation_gate:
  catalog_rows: reviewed_seed_only_until_DB006_migration
  model_status: draft_until_exact_source_version_and_conflict_review
  required_before_active:
    - tenant_scoped_vendor_and_parent_ids
    - exact_model_code_evidence
    - duplicate_and_ambiguous_model_report
    - CAT-009_alias_conflict_result
    - CAT-011_manual_resolution_state
  forbidden:
    - infer_vendor_from_model_string
    - infer_driver_from_alias
    - create_family_or_series_from_unreviewed_free_text
    - rewrite_v1_ai_document_metadata

rollback:
  runtime: disable_cat005_catalog_reads_and_use_v1_advisory_resolver
  data: retain_reviewed_seed_artifact_and_all_v1_metadata
  production_ddl: none_in_CAT-005
