task_id: CAT-007
priority: P0
owner: NET+AI
milestone: M2
status: reviewed_sample_pending_os_catalog_migration
authority:
  vendor_scope: GOV-008
  os_software_contract: DB-007
  product_hierarchy: CAT-005
  source_taxonomy: CAT-002
  source_authority: Huawei Enterprise Support

vendor:
  vendor_id: huawei
  display_name: Huawei
  status: active
  catalog_scope: tenant-default-reviewed-seed

os_family:
  code: vrp
  display_name: Versatile Routing Platform
  status: active
  version_scheme: huawei_vrp_release
  description: Huawei VRP operating-system family; generation and release train remain separate catalog identities.
  source_refs:
    - cat001:huawei:info:documentation-conventions
  generations:
    - code: vrp5
      display_name: VRP 5
      status: draft
      generation_order: 5
      source_scope: legacy_s_series_ar_ne
      explicit_platform_mappings:
        - os_generation: vrp5
          cli_platform: huawei_vrp
          parser_platform: huawei_vrp
          driver_authority: false
      release_trains:
        - code: v200
          display_name: V200
          status: draft
          version_pattern: '^V200R[0-9]{3}C[0-9]{2}(?:SPC[0-9]+)?$'
          software_versions:
            - original_version_string: V200R001C00
              normalized_version: v200r001c00
              sort_key: [200, 1, 0, 0]
              status: draft
              source_ref: legacy-fixture:huawei:vrp5-display-version
    - code: vrp8
      display_name: VRP 8
      status: active
      generation_order: 8
      source_scope: cloudengine_and_newer_vrp8_devices
      explicit_platform_mappings:
        - os_generation: vrp8
          cli_platform: huawei_vrp
          parser_platform: huawei_vrpv8
          driver_authority: false
      release_trains:
        - code: v300
          display_name: V300
          status: active
          version_pattern: '^V300R[0-9]{3}C[0-9]{2}(?:SPC[0-9]+)?$'
          software_versions:
            - original_version_string: V300R024C10SPC500
              normalized_version: v300r024c10spc500
              sort_key: [300, 24, 10, 500]
              status: draft
              applicability: primary_CAT005_cloudengine_6800_scope
              source_ref: cat001:huawei:support:vxlan-guide
            - original_version_string: V300R023C00SPC500
              normalized_version: v300r023c00spc500
              sort_key: [300, 23, 0, 500]
              status: draft
              applicability: compatibility_CAT005_cloudengine_6800_scope
              source_ref: cat001:huawei:support:md-cli-guide

version_facts:
  original_version_string_immutable: true
  normalized_version_is_derived: true
  normalization: trim_nfkc_preserve_vendor_tokens_and_lowercase_for_lookup
  ordering: huawei_vrp_scheme_sort_key_only
  exact_lookup_requires: active_reviewed_version_row
  range_values: never_exact_version_identity

resolution_rules:
  vendor_required: true
  family_resolution:
    exact: [vrp, VRP, Versatile Routing Platform]
    unknown_family: UNKNOWN_and_no_driver_guess
  generation_resolution:
    exact: [VRP5, VRP8]
    bare_vrp: candidate_list_and_clarification
    unknown_generation: UNKNOWN_and_quarantine
  train_resolution:
    V200: candidate_train_only_until_exact_version
    V300: candidate_train_only_until_exact_version
    V600: out_of_first_batch_preserve_v1_value_and_require_review
    unknown_train: UNKNOWN_and_quarantine
  version_resolution:
    exact_active_version: use_only_matching_reviewed_version
    primary_or_compatibility_range: applicability_scope_not_exact_identity
    malformed_or_wrong_scheme: reject_or_pending_review
    unknown_version: UNKNOWN_and_require_source_or_clarification
  platform_resolution:
    rule: explicit_reviewed_mapping_only
    forbidden: infer_cli_platform_or_driver_from_version_or_train
  ambiguity:
    no_first_match_fallback: true
    return_candidates: true
    require_manual_clarification: true

source_refs:
  - source_ref: cat001:huawei:info:documentation-conventions
    source_type: command_reference
    url: https://info.support.huawei.com/enterprise/en/doc/EDOC1100439391/69a4eddd/documentation-conventions
    path_scope: /enterprise/en/doc/EDOC1100439391/
  - source_ref: cat001:huawei:support:vxlan-guide
    source_type: configuration_guide
    url: https://support.huawei.com/enterprise/en/doc/EDOC1100463796/2a5291b7/configuration-precautions-for-vxlan
    path_scope: /enterprise/en/doc/EDOC1100463796/
  - source_ref: cat001:huawei:support:md-cli-guide
    source_type: command_reference
    url: https://support.huawei.com/enterprise/en/doc/EDOC1100463785/a01f202f/md-cli-maintenance-operations
    path_scope: /enterprise/en/doc/EDOC1100463785/

unknown_and_legacy_policy:
  preserved_v1_fields: [ai_document.os_family, ai_document.os_generation, ai_document.software_train, ai_document.software_release, devices.version]
  never_rewrite_original: true
  out_of_scope_values: [V600, V800, V999R001C00]
  behavior: retain_original_return_UNKNOWN_and_require_review

activation_gate:
  catalog_rows: reviewed_seed_only_until_DB007_migration
  required_before_active:
    - vendor_scoped_os_family_and_generation_ids
    - version_scheme_validation
    - duplicate_and_ambiguous_version_report
    - source_evidence_and_content_hash
    - explicit_platform_mapping_review
  forbidden:
    - make_software_train_a_product_or_driver_parent
    - silently_coerce_unknown_version
    - rewrite_v1_original_version_string

rollback:
  runtime: disable_cat007_os_software_resolution_and_use_v1_metadata_filters
  data: retain_original_version_strings_and_reviewed_seed_artifact
  production_ddl: none_in_CAT-007
