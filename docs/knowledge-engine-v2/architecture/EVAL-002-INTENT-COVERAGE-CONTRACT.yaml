task_id: EVAL-002
title: Huawei and Cisco network-intent coverage
priority: P0
status: executable
authority: offline_fixture
scope:
  - cover both first-wave vendors across the six required network operations intents
  - bind each vendor/intent pair to its platform, product, OS and version fixture
  - require vendor-specific CLI vocabulary rather than treating vendor names as sufficient coverage
  - reuse EVAL-001 case identities without changing the frozen parent dataset
coverage:
  manifest: docs/knowledge-engine-v2/eval/eval-intent-coverage-v1.yaml
  manifest_report: docs/knowledge-engine-v2/eval/eval-intent-coverage-v1.manifest.json
  parent_dataset: docs/knowledge-engine-v2/eval/eval-query-dataset-v1.yaml
  parent_dataset_id: nexora-kb-eval-v1-20260817
  coverage_id: nexora-kb-eval-intent-coverage-v1-20260817
  vendors: [Huawei, Cisco]
  intents: [vlan, interface, ospf, ssh, ntp, route]
  track_count: 12
  examples_per_track: 3
  explicit_parent_cases_per_track: 9
  required_parent_query_types: [exact, alias, prefix, typo, wrong_vendor, product_conflict, version_exact, version_conflict, no_match]
invariants:
  - every vendor/intent combination exists exactly once
  - every track has at least three vendor-specific canonical CLI examples
  - exact parent case metadata matches the track platform/product/OS/version fields
  - exact parent case cites the declared stable fixture document ID
  - no track example contains credentials, tenant payloads or ACL data
  - no example requires external network access
safety:
  database: none
  sqlite: not_used
  external_network: forbidden
  secrets: forbidden
  production_writes: forbidden
verification:
  validator: scripts/knowledge_engine_v2_eval_intent_coverage_check.py
  focused_test: tests/knowledge_engine_v2/test_eval002_intent_coverage.py
  commands:
    - "$env:PYTHONPATH='backend'; .venv\\Scripts\\python.exe scripts/knowledge_engine_v2_eval_intent_coverage_check.py"
    - "$env:PYTHONPATH='backend'; .venv\\Scripts\\python.exe -m pytest tests/knowledge_engine_v2/test_eval002_intent_coverage.py -q -p no:cacheprovider"
    - ".venv\\Scripts\\python.exe -m py_compile scripts/knowledge_engine_v2_eval_intent_coverage_check.py tests/knowledge_engine_v2/test_eval002_intent_coverage.py"
    - "git diff --check"
  required_results:
    - status: PASS
    - track_count: 12
    - query_example_count: 36
    - database: none
    - sqlite: not_used
rollback:
  runtime: remove EVAL-002 coverage selection while retaining the EVAL-001 parent fixture
  data: delete the coverage manifest, report and validator in a documentation-only commit
  database: none; no migration or persistent rows are created
  compatibility: V1 routes, retrieval data and production documents are unchanged
