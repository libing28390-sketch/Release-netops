          - https://support.huawei.com/enterprise/en/doc/EDOC1100333453/ac09508/static-routes-and-dynamic-routes
          - https://support.huawei.com/enterprise/en/doc/EDOC1000047418/2ebe2b92/setting-parameters-for-ospf-neighbor-relationship
    source_authority: Huawei Enterprise Support
    allowed_source_kinds: [product_support, configuration_guide, command_reference, release_note]

