# Additive CAT-001 entries for the campus and data-center switch coverage
# required by the Copilot retrieval contract.  This file is intentionally
# separate from the frozen first-batch allowlist; both files are merged by the
# source-registry loader and retain exact HTTPS host/path matching.
contract_version: v1.0-additive
status: reviewed_for_knowledge_backfill
authority: official_vendor_documentation

vendor_entries:
  - vendor: Huawei
    vendor_key: huawei
    product_family: S5700/S6700
    model_pattern: S(57|67)00
    platform_code: huawei_vrp
    os_family: VRP
    primary_version: V200R024C10
    compatibility_version: V200R023C00
    official_hosts:
      - host: support.huawei.com
        path_prefixes:
          - /enterprise/en/doc/EDOC1100459443/
          - /enterprise/en/doc/EDOC1100333453/
          - /enterprise/en/doc/EDOC1000047418/
        source_urls:
