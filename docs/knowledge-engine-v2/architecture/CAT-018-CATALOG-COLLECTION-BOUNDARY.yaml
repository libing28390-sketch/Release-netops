task_id: CAT-018
priority: P2
owner: BE
milestone: M2
status: frozen_for_reviewed_contract
depends_on: [DB-001, DB-006, DB-013, CAT-013, CAT-014, CAT-015]
decision:
  choice: immutable_official_catalog_and_tenant_scoped_custom_collection_boundary
  summary: >-
    Expose reviewed product catalog facts as an official_catalog read-only
    projection. Expose custom collections through a separate tenant-scoped
    contract with explicit create/update/archive permissions. A custom row may
    retain opaque product-model references but cannot copy, overwrite, or
    impersonate official catalog identity.
  invariants:
    - official_catalog_rows_are_server_authoritative_and_immutable
    - official_catalog_has_no_custom_collection_mutation_route
    - custom_collection_kind_is_server_assigned
    - custom_collection_rows_are_tenant_scoped
    - custom_rows_hold_opaque_catalog_model_references_only
    - status_and_acl_fields_are_bounded_and_validated
    - mutations_require_resource_permission_and_redacted_audit_event
    - stale_updates_fail_closed_with_optimistic_concurrency
    - V1_fields_and_routes_are_unchanged

official_catalog:
  collection_kind: official_catalog
  read_only: true
  mutable: false
  mutation_routes: []
  authority:
    - docs/knowledge-engine-v2/catalog/CAT-005-HUAWEI-CE6800.yaml
    - docs/knowledge-engine-v2/catalog/CAT-006-CISCO-C9300.yaml
    - docs/knowledge-engine-v2/catalog/CAT-016-H3C-COMWARE.yaml
    - docs/knowledge-engine-v2/catalog/CAT-017-RUIJIE-RGOS.yaml
    - CAT-015 reviewed version import and rollback gate

custom_collection:
  collection_kind: custom
  tenant_scoped: true
  statuses: [draft, active, disabled, archived]
  writable_fields: [name, description, acl, catalog_model_refs, status]
  immutable_fields: [id, tenant_id, code, collection_kind, official, created_at, created_by]
  model_reference_policy: opaque_catalog_model_ids_only
  persistence: contract_only_ephemeral_custom_collection_registry
  physical_repository: kb_collection_after_DB001_DB013_migration_gate

api_contract:
  base_path: /api/knowledge-v2/collections
  routes:
    - method: GET
      path: /boundary
      action: read
    - method: GET
      path: /
      action: read
    - method: POST
      path: /
      action: create
    - method: PATCH
      path: /{collection_id}
      action: update
    - method: POST
      path: /{collection_id}/archive
      action: archive
  archive_requires_confirm: true
  stale_update_status: 409
  error_codes:
    - COLLECTION_KIND_SERVER_AUTHORITY
    - COLLECTION_OFFICIAL_READ_ONLY
    - COLLECTION_STALE
    - COLLECTION_PERMISSION_DENIED

security_and_rollback:
  rbac_resource: knowledge_collection
  viewer_actions: [read, view]
  maintainer_actions: [read, view, create, update, archive]
  audit_category: knowledge_catalog
  audit_target_type: knowledge_custom_collection
  secrets_in_payload_or_audit: forbidden
  rollback: disable_CAT018_collection_routes_and_remove_adapter_without_touching_V1_or_official_seed
  production_ddl: none

acceptance:
  - official_catalog_response_marks_every_row_read_only_and_non_mutable
  - custom_collection_create_update_archive_is_separate_from_catalog_routes
  - official_identity_fields_are_rejected_on_create_and_update
  - custom_collection_tenant_isolation_and_rbac_are_enforced
  - ACL_refs_status_limits_and_unknown_fields_fail_closed
  - stale_updates_and_archived_updates_are_rejected
  - audit_callback_is_redacted_and_mutation_is_atomic
  - focused_catalog_regression_DB_AI_V1_lint_build_compile_secret_diff_checks_pass
