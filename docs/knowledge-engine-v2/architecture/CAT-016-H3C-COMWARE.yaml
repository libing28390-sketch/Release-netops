  summary: >-
    Add an H3C S6520X/Comware 7 reviewed sample to the read-only catalog
    adapter. Keep product, OS generation, release train, software version,
    device identity, connection driver, and parser namespace as separate
    fields. Do not widen CAT-001's Huawei/Cisco first-batch source allowlist or
    activate outbound collection as part of this P2 task.
  invariants:
    - H3C_model_identity_is_explicit_and_not_vendor_inferred
    - Comware_generation_and_release_train_are_orthogonal_to_product
    - exact_CMW710_versions_are_reviewed_candidates_only
    - h3c_comware_is_catalog_identity_and_hp_comware_is_driver_and_parser
    - unknown_or_ambiguous_values_fail_closed
    - CAT001_first_batch_allowlist_remains_unchanged
    - V1_metadata_and_device_fields_are_never_rewritten

