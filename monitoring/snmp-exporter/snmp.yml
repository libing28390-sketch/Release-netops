    - 1.3.6.1.2.1.1.5.0
    metrics:
    - name: ifMtu
      oid: 1.3.6.1.2.1.2.2.1.4
      type: gauge
      help: Maximum transmission unit of the interface.
      indexes:
      - labelname: ifIndex
        type: gauge
    - name: ifSpeed
      oid: 1.3.6.1.2.1.2.2.1.5
      type: gauge
      help: Interface speed in bits per second (32-bit value).
      indexes:
      - labelname: ifIndex
