# Base PoC configuration.  Production auth/module artifacts are generated by
# Nexora's versioned compiler and mounted alongside this file.
auths: {}

modules:
  generic_ifmib_interface_std:
    walk:
      - 1.3.6.1.2.1.2.2       # IF-MIB
      - 1.3.6.1.2.1.31.1.1    # IF-MIB high capacity counters
    max_repetitions: 25
    retries: 2
    timeout: 3s

  generic_system_std:
    walk:
      - 1.3.6.1.2.1.1.3       # sysUpTime
    max_repetitions: 10
    retries: 2
    timeout: 3s
