name: Build and Sync to Release Repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # 当推送形如 v1.0.0 的标签时触发
  workflow_dispatch: # 允许在网页上点击按钮手动触发

jobs:
  release-ubuntu:
    name: Release Ubuntu / Linux (main branch)
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取开发库代码
        uses: actions/checkout@v4

      - name: 2. 彻底清理敏感文件、开发源码与 Windows 专属文件
        run: |
          # ── 开发者专用工具 ──
          rm -rf tools/

          # ── 编译脚本及 Windows 客户端工具（客户不需要）──
          rm -rf scripts/

          # ── 开发者内部文档 / 笔记 ──
          rm -f bug_fix_memory.md
          rm -f PAM_Audit_Restoration_Report.md
          rm -rf docs/
          rm -rf brain/
          rm -rf skills/
          rm -rf .github/skills/
          rm -rf .agents/

          # ── 测试 / 调试脚本与自动化单元测试用例（商用脱敏，不暴露给客户） ──
          rm -rf scratch/
          rm -rf backend/scratch/
          rm -rf backend/tests/
          rm -f pytest.ini
          rm -f backend/_check_audit.py
          rm -f backend/check_executions.py
          rm -f backend/check_results.py
          rm -f backend/debug_device.py
          rm -f backend/find_target.py
          rm -f _purge_bogus_backups.py
          # 任何在仓库根目录残留 of _xxx.py 临时排障脚本一律剔除
          find . -maxdepth 2 -type f -name '_*.py' -not -path './.git/*' -delete || true

          # ── 临时部署补丁 / 排障脚本（开发期使用，正式发布不需要） ──
          rm -f patch-vmware.sh
          rm -f patch-*.sh
          rm -f hotfix-*.sh

          # ── 历史任务进度 / 开发期 todo（绝对不能发给客户） ──
          rm -f task.md task_progress.md
          rm -f task-*.md task_*.md
          rm -f implementation_plan.md walkthrough.md
          rm -f refactor.cjs refactor2.cjs

          # ── 本地数据库文件（客户应使用自己的 PostgreSQL）──
          rm -f netops.db backend/netops.db backend/netsops.db

          # ── AI 助手 / IDE 残留文件 ──
          rm -rf .codex/ .cursor/ .playwright-mcp/ .vscode/
          rm -f .clinerules .cursorrules .geminirules mcp-config.json
          rm -f -- "--version"

          # ── Windows 专属文件清理（只发给 Ubuntu/Linux 用户） ──
          rm -rf desktop/
          rm -f NetOps.exe NetOps.spec start.bat netops_logo.png

          # ── GitHub Actions 配置（发布仓库不需要 CI）──
          rm -rf .github/
          
      - name: 3. 将处理后的安全代码推送到对外发布仓库 main 分支
        run: |
          # 配置自动化机器人的 Git 身份
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 抹除之前在开发库里的所有 Commit 历史记录（防止客户从历史里翻到源码）
          rm -rf .git
          git init
          git add .
          git commit -m "🚀 Release build: Production ready stable Ubuntu release"
          
          # 推送到客户专门用的发布库 Release-netops 的 main 分支
          git branch -M main
          git remote add origin https://${{ secrets.RELEASE_REPO_TOKEN }}@github.com/libing28390-sketch/Release-netops.git
          git push -u origin main --force
          
          # 针对生成的提交创建 Tag 并强制推送 (仅在推送版本标签时执行)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git tag ${{ github.ref_name }}
            git push origin ${{ github.ref_name }} --force
          fi

      - name: 4. 从开发库获取自动生成的 Release 日志
        id: get_notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const tag = context.payload.ref.replace('refs/tags/', '');
              const response = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag
              });
              core.setOutput('body', response.data.body);
            } catch (err) {
              core.warning('无法生成 Release 日志: ' + err.message);
              core.setOutput('body', '🚀 Release build: Production ready stable Ubuntu release');
            }

      - name: 5. 在对外发布仓库创建 Release 并挂载日志
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: libing28390-sketch/Release-netops
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.get_notes.outputs.body }}
          draft: false
          prerelease: false

  release-windows:
    name: Release Windows (windows branch)
    needs: release-ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取开发库代码
        uses: actions/checkout@v4

      - name: 2. 彻底清理敏感文件、开发源码与 Linux/Docker 专属文件
        run: |
          # ── 开发者专用工具 ──
          rm -rf tools/

          # ── 编译脚本及 Windows 客户端工具（客户不需要）──
          rm -rf scripts/

          # ── 开发者内部文档 / 笔记 ──
          rm -f bug_fix_memory.md
          rm -f PAM_Audit_Restoration_Report.md
          rm -rf docs/
          rm -rf brain/
          rm -rf skills/
          rm -rf .github/skills/
          rm -rf .agents/

          # ── 测试 / 调试脚本与自动化单元测试用例（商用脱敏，不暴露给客户） ──
          rm -rf scratch/
          rm -rf backend/scratch/
          rm -rf backend/tests/
          rm -f pytest.ini
          rm -f backend/_check_audit.py
          rm -f backend/check_executions.py
          rm -f backend/check_results.py
          rm -f backend/debug_device.py
          rm -f backend/find_target.py
          rm -f _purge_bogus_backups.py
          # 任何在仓库根目录残留 of _xxx.py 临时排障脚本一律剔除
          find . -maxdepth 2 -type f -name '_*.py' -not -path './.git/*' -delete || true

          # ── 临时部署补丁 / 排障脚本（开发期使用，正式发布不需要） ──
          rm -f patch-vmware.sh
          rm -f patch-*.sh
          rm -f hotfix-*.sh

          # ── 历史任务进度 / 开发期 todo（绝对不能发给客户） ──
          rm -f task.md task_progress.md
          rm -f task-*.md task_*.md
          rm -f implementation_plan.md walkthrough.md
          rm -f refactor.cjs refactor2.cjs

          # ── 本地数据库文件（客户应使用自己的 PostgreSQL）──
          rm -f netops.db backend/netops.db backend/netsops.db

          # ── AI 助手 / IDE 残留文件 ──
          rm -rf .codex/ .cursor/ .playwright-mcp/ .vscode/
          rm -f .clinerules .cursorrules .geminirules mcp-config.json
          rm -f -- "--version"

          # ── Linux/Docker 专属文件清理（只发给 Windows 用户） ──
          rm -f deploy-ubuntu.sh deploy-ubuntu.gitee.sh Dockerfile docker-compose.yml .dockerignore
          rm -rf nginx/

          # ── GitHub Actions 配置（发布仓库不需要 CI）──
          rm -rf .github/
          
      - name: 3. 将处理后的安全代码推送到对外发布仓库 windows 分支
        run: |
          # 配置自动化机器人的 Git 身份
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 抹除之前在开发库里的所有 Commit 历史记录（防止客户从历史里翻到源码）
          rm -rf .git
          git init
          git add .
          git commit -m "🚀 Release build: Production ready stable Windows release"
          
          # 推送到客户专门用的发布库 Release-netops 的 windows 分支
          git branch -M windows
          git remote add origin https://${{ secrets.RELEASE_REPO_TOKEN }}@github.com/libing28390-sketch/Release-netops.git
          git push -u origin windows --force
          
          # 针对 Windows 分支的提交创建独特的 Tag 并强制推送 (仅在推送版本标签时执行)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git tag "${{ github.ref_name }}-windows"
            git push origin "${{ github.ref_name }}-windows" --force
          fi
