name: Build and Sync to Release Repo

on:
  push:
    branches:
      - main  # 只有推送到 main 分支时才会触发
  workflow_dispatch: # 允许在网页上点击按钮手动触发

jobs:
  build_and_sync:
    runs-on: ubuntu-latest # 强制使用 Ubuntu 环境以编译生成 .so 文件
    
    steps:
      - name: 1. 拉取开发库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 3. 安装 Cython 编译依赖
        run: pip install cython setuptools

      - name: 4. 编译核心安全代码 (生成 Ubuntu 适用的 .so 动态库)
        run: |
          python scripts/compile_license.py build_ext --inplace

      - name: 5. 彻底清理敏感文件与原始源码
        run: |
          # ── License 核心：删除原始 Python 源码及 Cython 中间 C 文件 ──
          rm -f backend/license_auth/verifier.py backend/license_auth/verifier.c
          rm -f backend/license_auth/crypto.py  backend/license_auth/crypto.c

          # ── 私钥：绝对不能发给客户 ──
          rm -f backend/license_auth/keys/private.pem

          # ── 开发者专用工具 ──
          rm -rf tools/

          # ── 编译脚本及 Windows 客户端工具（客户不需要）──
          rm -rf scripts/

          # ── 开发者内部文档 / 笔记 ──
          rm -f bug_fix_memory.md
          rm -f PAM_Audit_Restoration_Report.md
          rm -rf docs/
          rm -rf brain/
          rm -rf skills/
          rm -rf .github/skills/

          # ── 测试 / 调试脚本 ──
          rm -rf scratch/
          rm -rf backend/scratch/
          rm -f backend/_check_audit.py
          rm -f backend/check_executions.py
          rm -f backend/check_results.py
          rm -f backend/debug_device.py
          rm -f backend/find_target.py
          rm -f _purge_bogus_backups.py

          # ── 本地数据库文件（客户应使用自己的 PostgreSQL）──
          rm -f netops.db backend/netops.db backend/netsops.db

          # ── 本地 license 数据（不能把开发测试 license 带过去）──
          rm -f data/license*.json

          # ── AI 助手 / IDE 残留文件 ──
          rm -rf .codex/ .cursor/ .playwright-mcp/ .vscode/
          rm -f .clinerules .cursorrules .geminirules mcp-config.json
          rm -f -- "--version"

          # ── GitHub Actions 配置（发布仓库不需要 CI）──
          rm -rf .github/
          
      - name: 6. 将处理后的安全代码推送到对外发布仓库
        run: |
          # 配置自动化机器人的 Git 身份
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 抹除之前在开发库里的所有 Commit 历史记录（防止客户从历史里翻到源码）
          rm -rf .git
          git init
          git add .
          git commit -m "🚀 Release build: Production ready stable release"
          
          # 推送到客户专门用的发布库 Release-netops
          git branch -M main
          git remote add origin https://${{ secrets.RELEASE_REPO_TOKEN }}@github.com/libing28390-sketch/Release-netops.git
          git push -u origin main --force
