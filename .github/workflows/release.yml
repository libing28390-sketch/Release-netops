name: Build and Sync to Release Repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-ubuntu:
    name: Release Ubuntu / Linux (main branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Validate core Docker inputs and build frontend
        shell: bash
        run: |
          set -euo pipefail
          required=(Dockerfile docker-compose.yml .dockerignore .env.example package.json package-lock.json backend/requirements.txt backend/main.py NexoraTerminalAgent.exe data/textfsm_templates nginx/Dockerfile nginx/.dockerignore nginx/nginx.conf nginx/docker-entrypoint.d/05-ensure-tls-certificate.sh scripts/deploy-docker.sh scripts/terminal_agent.py scripts/install-terminal-agent.sh scripts/install-terminal-agent.ps1 src)
          for path in "${required[@]}"; do
            test -e "$path" || { echo "[FAIL] Missing release input: $path"; exit 1; }
          done
          npm ci --ignore-scripts
          npm run build
          python -m compileall -q backend

      - name: Remove private and development-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/

          # Keep only the operational scripts referenced by public deployment docs.
          if [ -d scripts ]; then
            find scripts -mindepth 1 -maxdepth 1 \
              ! -name 'deploy-docker.sh' \
              ! -name 'preflight-check.sh' \
              ! -name 'install-daily-backup.sh' \
              ! -name 'netops.logrotate' \
              ! -name 'generate_ssl_cert.py' \
              ! -name 'terminal_agent.py' \
              ! -name 'install-terminal-agent.sh' \
              ! -name 'install-terminal-agent.ps1' \
              -exec rm -rf {} +
          fi

          rm -f bug_fix_memory.md PAM_Audit_Restoration_Report.md
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name deploy -exec rm -rf {} +
          fi
          rm -rf brain/ skills/ .github/skills/ .agents/

          rm -rf scratch/ backend/scratch/
          rm -rf backend/scripts/
          if [ -d backend/tests ]; then
            find backend/tests -mindepth 1 -maxdepth 1 ! -name fixtures -exec rm -rf {} +
          fi
          rm -f pytest.ini backend/_check_audit.py backend/check_executions.py
          rm -f backend/check_results.py backend/debug_device.py backend/find_target.py
          rm -f _purge_bogus_backups.py
          find . -maxdepth 2 -type f -name '_*.py' -not -path './.git/*' -delete || true

          rm -f patch-vmware.sh patch-*.sh hotfix-*.sh
          rm -f task.md task_progress.md task-*.md task_*.md
          rm -f implementation_plan.md walkthrough.md refactor.cjs refactor2.cjs

          # Runtime data and backups must never enter the public repository.
          rm -f netops.db backend/netops.db backend/netsops.db data/netops.db.bak
          rm -rf data/backups/ data/pam_recordings/ data/logs/
          rm -rf data/change_order_attachments/ backup/

          rm -rf .codex/ .cursor/ .playwright-mcp/ .vscode/
          rm -f .clinerules .cursorrules .geminirules mcp-config.json
          rm -f -- "--version"

          rm -rf desktop/
          rm -f NetOps.exe NetOps.spec NexoraTerminalAgent.spec start.bat netops_logo.png
          rm -rf .github/

          # TLS keys and certificates are deployment inputs, never release content.
          mkdir -p nginx/ssl
          find nginx/ssl -mindepth 1 -delete
          touch nginx/ssl/.gitkeep

      - name: Commit sanitized Ubuntu release tree
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          rm -rf .git
          git init
          git add .

          required=(Dockerfile docker-compose.yml .dockerignore .env.example package.json package-lock.json backend/requirements.txt backend/main.py NexoraTerminalAgent.exe nginx/Dockerfile nginx/.dockerignore nginx/nginx.conf nginx/docker-entrypoint.d/05-ensure-tls-certificate.sh scripts/deploy-docker.sh scripts/terminal_agent.py scripts/install-terminal-agent.sh scripts/install-terminal-agent.ps1 src)
          for path in "${required[@]}"; do
            test -n "$(git ls-files -- "$path" | head -n 1)" || { echo "[FAIL] Required release path missing: $path"; exit 1; }
          done
          for path in backend/scripts data/netops.db.bak data/backups data/pam_recordings nginx/ssl/netops.crt nginx/ssl/netops.key; do
            test -z "$(git ls-files -- "$path")" || { echo "[FAIL] Forbidden path staged: $path"; exit 1; }
          done

          git commit -m "Release build: Production ready stable Ubuntu release"
          git branch -M main
          git remote add origin https://${{ secrets.RELEASE_REPO_TOKEN }}@github.com/libing28390-sketch/Release-netops.git
          git push -u origin main --force

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git tag "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}" --force
          fi

      - name: Generate release notes
        id: get_notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const tag = context.payload.ref.replace('refs/tags/', '');
              const response = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag
              });
              core.setOutput('body', response.data.body);
            } catch (err) {
              core.warning('Unable to generate release notes: ' + err.message);
              core.setOutput('body', 'Release build: Production ready stable Ubuntu release');
            }

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: libing28390-sketch/Release-netops
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.get_notes.outputs.body }}
          draft: false
          prerelease: false

  release-windows:
    name: Release Windows (windows branch)
    needs: release-ubuntu
    runs-on: windows-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pillow pystray certifi

      - name: Build NetOps.exe
        shell: bash
        run: |
          pyinstaller NetOps.spec
          cp dist/NetOps.exe ./NetOps.exe
          rm -rf build/ dist/

      - name: Build NexoraTerminalAgent.exe
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --name NexoraTerminalAgent scripts/terminal_agent.py
          cp dist/NexoraTerminalAgent.exe ./NexoraTerminalAgent.exe
          rm -rf build/ dist/

      - name: Remove private and Linux-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/ scripts/
          rm -f bug_fix_memory.md PAM_Audit_Restoration_Report.md
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name deploy -exec rm -rf {} +
          fi
          rm -rf brain/ skills/ .github/skills/ .agents/
          rm -rf scratch/ backend/scratch/
          rm -rf backend/scripts/
          if [ -d backend/tests ]; then
            find backend/tests -mindepth 1 -maxdepth 1 ! -name fixtures -exec rm -rf {} +
          fi
          rm -f pytest.ini backend/_check_audit.py backend/check_executions.py
          rm -f backend/check_results.py backend/debug_device.py backend/find_target.py
          rm -f _purge_bogus_backups.py
          find . -maxdepth 2 -type f -name '_*.py' -not -path './.git/*' -delete || true
          rm -f patch-vmware.sh patch-*.sh hotfix-*.sh
          rm -f task.md task_progress.md task-*.md task_*.md
          rm -f implementation_plan.md walkthrough.md refactor.cjs refactor2.cjs
          rm -f netops.db backend/netops.db backend/netsops.db data/netops.db.bak
          rm -rf data/backups/ data/pam_recordings/ data/logs/
          rm -rf data/change_order_attachments/ backup/
          rm -rf .codex/ .cursor/ .playwright-mcp/ .vscode/
          rm -f .clinerules .cursorrules .geminirules mcp-config.json
          rm -f -- "--version"
          # Release templates are embedded in NetOps.exe and also kept in a
          # separate read-only directory for source-based Windows launches.
          # Do not leave them in data/textfsm_templates, which is reserved for
          # user-managed overrides and would otherwise shadow newer templates.
          if [ -d data/textfsm_templates ]; then
            rm -rf release-textfsm-templates
            mv data/textfsm_templates release-textfsm-templates
          fi
          rm -f deploy-ubuntu.sh deploy-ubuntu.gitee.sh Dockerfile docker-compose.yml .dockerignore
          rm -rf nginx/ .github/

      - name: Commit sanitized Windows release tree
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          rm -rf .git
          git init
          git add .

          required=(.env.example package.json package-lock.json backend/requirements.txt backend/main.py release-textfsm-templates desktop/launcher.py desktop/desktop_tray.py desktop/update_service.py NetOps.exe NexoraTerminalAgent.exe start.bat src)
          for path in "${required[@]}"; do
            test -n "$(git ls-files -- "$path" | head -n 1)" || { echo "[FAIL] Required Windows release path missing: $path"; exit 1; }
          done
          for path in backend/scripts data/netops.db.bak data/backups data/pam_recordings nginx/ssl/netops.crt nginx/ssl/netops.key; do
            test -z "$(git ls-files -- "$path")" || { echo "[FAIL] Forbidden path staged: $path"; exit 1; }
          done

          git commit -m "Release build: Production ready stable Windows release"
          git branch -M windows
          git remote add origin https://${{ secrets.RELEASE_REPO_TOKEN }}@github.com/libing28390-sketch/Release-netops.git
          git push -u origin windows --force

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git tag "${{ github.ref_name }}-windows"
            git push origin "${{ github.ref_name }}-windows" --force
          fi

      - name: Publish Windows executable release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: libing28390-sketch/Release-netops
          tag_name: ${{ github.ref_name }}-windows
          name: Windows Release ${{ github.ref_name }}
          files: NetOps.exe
          draft: false
          prerelease: false
