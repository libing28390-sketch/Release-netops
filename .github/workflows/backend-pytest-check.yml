name: Backend Pytest Check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pytest.ini"
      - ".github/workflows/backend-pytest-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "pytest.ini"
      - ".github/workflows/backend-pytest-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_knowledge_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_knowledge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # CI must never inherit a production dotenv.  These values are isolated,
    # non-secret test defaults; provider/device credentials stay in fixtures.
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_knowledge_ci
      REDIS_URL: redis://127.0.0.1:6379/11
      SECRET_KEY: test-only-secret-placeholder
      CREDENTIAL_ENCRYPTION_KEY: test-only-credential-placeholder
      AI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      NETWORK_WRITE_ENABLED: "false"
      PRODUCTION_CREDENTIALS_ALLOWED: "false"
      AI_GATEWAY_MODE: mock
      DATA_CLASSIFICATION: synthetic
      DEVICE_CREDENTIAL_SOURCE: fixture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Validate isolated knowledge test configuration
        run: python scripts/validate_knowledge_test_config.py --file docs/knowledge-engine/governance/test-environment.example --environment test

      - name: Enforce PostgreSQL-only policy
        run: python scripts/validate_postgresql_only.py

      - name: Run pytest (strict)
        run: pytest
