name: Knowledge Engine Evaluation

on:
  push:
    branches: [main]
    paths:
      - "backend/ai/services/evaluation_metrics.py"
      - "backend/ai/services/security_evaluation_metrics.py"
      - "docs/knowledge-engine/eval/**"
      - "docs/knowledge-engine/architecture/EVAL-*.yaml"
      - "scripts/knowledge_eval_*.py"
      - "scripts/promptfoo_*.py"
      - "backend/ai/**"
      - "backend/database/**"
      - "tests/knowledge_engine/test_eval*.py"
      - ".github/workflows/knowledge-engine-eval.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/ai/services/evaluation_metrics.py"
      - "backend/ai/services/security_evaluation_metrics.py"
      - "docs/knowledge-engine/eval/**"
      - "docs/knowledge-engine/architecture/EVAL-*.yaml"
      - "scripts/knowledge_eval_*.py"
      - "scripts/promptfoo_*.py"
      - "backend/ai/**"
      - "backend/database/**"
      - "tests/knowledge_engine/test_eval*.py"
      - ".github/workflows/knowledge-engine-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-fixed-set:
    name: EVAL-010 small fixed set (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_knowledge_eval
      PYTHONPATH: backend
      SECRET_KEY: test-only-secret-placeholder
      CREDENTIAL_ENCRYPTION_KEY: test-only-credential-placeholder
      AI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      NETWORK_WRITE_ENABLED: "false"
      PRODUCTION_CREDENTIALS_ALLOWED: "false"
      AI_GATEWAY_MODE: mock
      DATA_CLASSIFICATION: synthetic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL with pgvector
        uses: ./.github/actions/postgres
        with:
          database: nexora_knowledge_eval
          user: postgres
          password: postgres
          container-name: nexora-postgres-eval-ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Bootstrap isolated PostgreSQL Knowledge Engine corpus
        run: python scripts/knowledge_eval_bootstrap.py

      - name: Validate PostgreSQL-only gate wiring
        run: |
          python scripts/knowledge_eval_ci_gate_check.py
          python scripts/ai_rag_release_config_check.py

      - name: Run small fixed evaluation set
        run: |
          python scripts/knowledge_eval_offline.py \
            --profile small \
            --strict \
            --output "$RUNNER_TEMP/eval-offline-small-report-v1.json"

      - name: Run small fixed set regression tests
        run: >-
          pytest -q -p no:cacheprovider
          tests/knowledge_engine/test_eval001_query_dataset.py
          tests/knowledge_engine/test_eval003_query_type_coverage.py
          tests/knowledge_engine/test_eval005_metrics.py
          tests/knowledge_engine/test_eval007_security_metrics.py
          tests/knowledge_engine/test_eval010_ci_gate.py

      - name: Run 50-anchor deterministic quality gate
        shell: bash
        run: |
          set -euo pipefail
          gate_status=0

          # The evaluator is intentionally allowed to fail the job when the
          # retrieval threshold is not met; a safety-only 50/50 result is not
          # a release pass.  Continue long enough to emit the companion
          # metadata-only evidence files and explicit NOT_READY status.
          python scripts/knowledge_eval_anchors_50_runner.py \
            --dataset docs/knowledge-engine/eval/eval-golden-anchors-50-v3-signed-20260905.yaml \
            --output "$RUNNER_TEMP/eval-anchors-50-v3-signed-report.json" || gate_status=1
          python scripts/knowledge_eval_baseline_manifest.py \
            --output "$RUNNER_TEMP/eval-baseline-manifest.json" || gate_status=1
          python scripts/knowledge_eval_anchor_review_check.py --database || gate_status=1
          python scripts/knowledge_eval_gold_400_check.py \
            --output "$RUNNER_TEMP/eval-golden-400-check.json" || gate_status=1
          # The source/provenance gate and retrieval-quality gate are separate.
          # Run the latter against a disposable PostgreSQL corpus built from
          # the checked-in source-backed local pack; it must not read or mutate
          # the application database used by the bootstrap step.
          python scripts/knowledge_eval_gold_400_retrieval.py \
            --output "$RUNNER_TEMP/eval-golden-400-retrieval.json" || gate_status=1

          # Run the same 50-anchor evaluator against a disposable PostgreSQL
          # database containing only the checked-in official template corpus.
          # This is independent evidence for corpus reproducibility; it does
          # not replace or relax the strict application-corpus gate above.
          python scripts/knowledge_eval_anchors_50_isolated.py \
            --dataset docs/knowledge-engine/eval/eval-golden-anchors-50-v3-signed-20260905.yaml \
            --output "$RUNNER_TEMP/eval-anchors-50-isolated-report.json" || gate_status=1

          # Build a machine-source-reviewed candidate without replacing the
          # signed frozen dataset above.  This produces reproducible official-
          # source evidence and exercises the candidate corpus independently.
          python scripts/knowledge_eval_anchor_source_review.py \
            --dataset-output "$RUNNER_TEMP/eval-golden-anchors-50-source-reviewed-v2.yaml" \
            --report-output "$RUNNER_TEMP/eval-golden-anchors-50-source-review.json" || gate_status=1
          # The checked-in signed dataset is the authoritative review input;
          # the generated candidate remains a non-authoritative comparison
          # artifact and is intentionally not allowed to replace signoff.
          python scripts/knowledge_eval_anchor_review_check.py \
            --database \
            --dataset docs/knowledge-engine/eval/eval-golden-anchors-50-v3-signed-20260905.yaml \
            --output "$RUNNER_TEMP/eval-anchors-50-v3-signed-review.json" || gate_status=1
          python scripts/knowledge_eval_anchors_50_isolated.py \
            --dataset "$RUNNER_TEMP/eval-golden-anchors-50-source-reviewed-v2.yaml" \
            --output "$RUNNER_TEMP/eval-anchors-50-source-reviewed-v2-isolated-report.json" || gate_status=1

          exit "$gate_status"

      - name: Upload redacted evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-eval-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eval-baseline-manifest.json
            ${{ runner.temp }}/eval-anchors-50-v3-signed-report.json
            ${{ runner.temp }}/eval-golden-400-check.json
            ${{ runner.temp }}/eval-golden-400-retrieval.json
            ${{ runner.temp }}/eval-anchors-50-isolated-report.json
            ${{ runner.temp }}/eval-golden-anchors-50-source-reviewed-v2.yaml
            ${{ runner.temp }}/eval-golden-anchors-50-source-review.json
            ${{ runner.temp }}/eval-anchors-50-v3-signed-review.json
            ${{ runner.temp }}/eval-anchors-50-source-reviewed-v2-isolated-report.json
            docs/knowledge-engine/eval/eval-golden-anchors-50-v3-signed-20260905.yaml
          if-no-files-found: warn
