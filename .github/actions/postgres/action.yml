name: Start PostgreSQL with pgvector
description: Build and start the repository PostgreSQL image with vector and pg_trgm available

inputs:
  database:
    description: PostgreSQL database name
    required: true
  user:
    description: PostgreSQL user
    required: true
  password:
    description: PostgreSQL password
    required: true
  container-name:
    description: Docker container name
    required: false
    default: nexora-postgres-ci
  image:
    description: Local Docker image tag
    required: false
    default: nexora-postgres-ci:ci
  port:
    description: Host port exposed for PostgreSQL
    required: false
    default: "5432"

runs:
  using: composite
  steps:
    - name: Build PostgreSQL CI image
      shell: bash
      env:
        POSTGRES_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        docker build \
          --file docker/postgres/Dockerfile \
          --tag "$POSTGRES_IMAGE" \
          docker/postgres

    - name: Start PostgreSQL CI container
      shell: bash
      env:
        POSTGRES_DB: ${{ inputs.database }}
        POSTGRES_USER: ${{ inputs.user }}
        POSTGRES_PASSWORD: ${{ inputs.password }}
        POSTGRES_CONTAINER: ${{ inputs.container-name }}
        POSTGRES_IMAGE: ${{ inputs.image }}
        POSTGRES_PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail

        docker run --detach \
          --name "$POSTGRES_CONTAINER" \
          --publish "$POSTGRES_PORT:5432" \
          --env "POSTGRES_DB=$POSTGRES_DB" \
          --env "POSTGRES_USER=$POSTGRES_USER" \
          --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
          --env "POSTGRES_EXPORTER_USER=nexora_metrics_ci" \
          --env "POSTGRES_EXPORTER_PASSWORD=ci-only-postgres-exporter-password" \
          "$POSTGRES_IMAGE"

        for attempt in $(seq 1 60); do
          if docker exec "$POSTGRES_CONTAINER" \
            pg_isready --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" >/dev/null 2>&1; then
            break
          fi
          if [[ "$attempt" -eq 60 ]]; then
            docker logs "$POSTGRES_CONTAINER"
            exit 1
          fi
          sleep 2
        done

        available_extensions="$(docker exec \
          --env "PGPASSWORD=$POSTGRES_PASSWORD" \
          "$POSTGRES_CONTAINER" \
          psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
          --tuples-only --no-align \
          --command "SELECT name FROM pg_available_extensions WHERE name IN ('vector', 'pg_trgm') ORDER BY name;")"

        for extension in pg_trgm vector; do
          if ! printf '%s\n' "$available_extensions" | grep --fixed-strings --line-regexp --quiet "$extension"; then
            echo "Required PostgreSQL extension is unavailable in CI image: $extension"
            docker logs "$POSTGRES_CONTAINER"
            exit 1
          fi
        done
