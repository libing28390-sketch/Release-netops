global:
  scrape_interval: 60s
  scrape_timeout: 30s
scrape_configs:
- job_name: network_snmp
  file_sd_configs:
  - files:
    - /etc/nexora-collector/runtime/vmagent/targets/snmp_targets.yml
  metrics_path: /snmp
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - nexora_module
    target_label: __param_module
  - source_labels:
    - nexora_auth
    target_label: __param_auth
  - source_labels:
    - nexora_scrape_interval
    target_label: __scrape_interval__
  - source_labels:
    - nexora_scrape_timeout
    target_label: __scrape_timeout__
  - source_labels:
    - __param_target
    target_label: instance
  - source_labels:
    - nexora_asset_id
    target_label: asset_id
  - source_labels:
    - nexora_hostname
    target_label: hostname
  - source_labels:
    - nexora_tenant_id
    target_label: tenant_id
  - source_labels:
    - nexora_site_id
    target_label: site_id
  - source_labels:
    - nexora_site_name
    target_label: site_name
  - source_labels:
    - nexora_vendor
    target_label: vendor
  - source_labels:
    - nexora_platform
    target_label: platform
  - source_labels:
    - nexora_role
    target_label: role
  - action: labeldrop
    regex: nexora_auth|nexora_.*
  - target_label: __address__
    replacement: snmp-exporter:9116
  metric_relabel_configs:
  - source_labels:
    - ifName
    regex: .+
    target_label: interface_role
    replacement: unclassified
    action: replace
  - source_labels:
    - ifName
    regex: .+
    target_label: utilization_warn_pct
    replacement: '60'
    action: replace
  - source_labels:
    - ifName
    regex: .+
    target_label: utilization_high_pct
    replacement: '75'
    action: replace
  - source_labels:
    - ifName
    regex: .+
    target_label: utilization_critical_pct
    replacement: '90'
    action: replace
- job_name: linux_servers
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  file_sd_configs:
  - files:
    - /etc/nexora-collector/runtime/vmagent/targets/*linux*.yml
    - /etc/nexora-collector/runtime/vmagent/targets/*server*.yml
- job_name: windows_servers
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  file_sd_configs:
  - files:
    - /etc/nexora-collector/runtime/vmagent/targets/*windows*.yml
- job_name: platform_api
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
  - targets:
    - netops:8003
- job_name: platform_hardware_inventory
  scrape_interval: 60s
  scrape_timeout: 30s
  metrics_path: /hardware-metrics
  static_configs:
  - targets:
    - netops:8003
- job_name: platform_victoriametrics
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
  - targets:
    - victoriametrics:8428
- job_name: platform_vmagent
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
  - targets:
    - vmagent:8429
- job_name: platform_snmp_exporter
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
  - targets:
    - snmp-exporter:9116
- job_name: platform_grafana
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /grafana/metrics
  static_configs:
  - targets:
    - grafana:3000
- job_name: platform_cadvisor
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: platform_postgres_exporter
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
  - targets:
    - postgres-exporter:9187
