modules:
  generic_system_std:
    walk:
    - 1.3.6.1.2.1.1
    get:
    - 1.3.6.1.2.1.1.1.0
    - 1.3.6.1.2.1.1.3.0
    - 1.3.6.1.2.1.1.5.0
    - 1.3.6.1.2.1.1.6.0
    - 1.3.6.1.2.1.1.4.0
    - 1.3.6.1.2.1.1.2.0
    metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: Time since the network management portion of the system was last re-initialized.
    - name: sysDescr
      oid: 1.3.6.1.2.1.1.1
      type: DisplayString
      help: Textual description of the managed device.
    - name: sysName
      oid: 1.3.6.1.2.1.1.5
      type: DisplayString
      help: Administratively assigned name of the managed device.
    - name: sysLocation
      oid: 1.3.6.1.2.1.1.6
      type: DisplayString
      help: Physical location of the managed device.
    - name: sysContact
      oid: 1.3.6.1.2.1.1.4
      type: DisplayString
      help: Contact person for the managed device.
    - name: sysObjectID
      oid: 1.3.6.1.2.1.1.2
      type: DisplayString
      help: Vendor authoritative identification of the network management subsystem.
    max_repetitions: 10
    retries: 2
    timeout: 3s
